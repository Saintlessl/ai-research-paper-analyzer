[project]
name = "research-paper-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic-settings>=2.5", "pypdf>=5.0", "google-genai>=1.0", "python-multipart>=0.0.12"]
[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
