[project]
name = "research-paper-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic-settings>=2.5", "pypdf>=5.0", "google-genai>=1.0", "python-multipart>=0.0.12"]
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13.0",
    # Starlette 1.6.0 still imports an alias deprecated by AnyIO 4.15.
    "anyio>=4.10,<4.15",
    "reportlab>=5.0.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
